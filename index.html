<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tracks Visualizer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs"></script>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="map"></div>
<div id="trackPanelContainer"></div>
<div id="hud">
    <div><b>Режим:</b> <span id="modeLabel">Скорость</span></div>
    <div><b>Скорость:</b> <span id="speedLabel">—</span></div>
    <div><b>Пульс:</b> <span id="hrLabel">—</span></div>
    <div><b>Высота:</b> <span id="eleLabel">—</span></div>
    <div><b>Время:</b> <span id="timeLabel">—</span></div>
</div>
<div id="legend"></div>
<div id="playbackControls">
    <button id="playBtn">▶</button>
    <button id="pauseBtn">⏸</button>
    <button id="chartsBtn">📈</button>
</div>
<div id="chartContainer"><canvas id="chart"></canvas></div>
<div id="tooltip"></div>
<div id="versionTag">v1.1.0 (2026-05-16)</div>
<script type="module" src="app.js"></script>
</body>
</html>
