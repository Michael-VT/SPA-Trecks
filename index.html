<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tracks Visualizer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hammerjs"></script>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="map"></div>
<div id="trackPanelContainer"></div>
<div id="hud">
    <div><b>Режим:</b> <span id="modeLabel">Скорость</span></div>
    <div><b>Скорость:</b> <span id="speedLabel">—</span></div>
    <div><b>Пульс:</b> <span id="hrLabel">—</span></div>
    <div><b>Высота:</b> <span id="eleLabel">—</span></div>
    <div><b>Время:</b> <span id="timeLabel">—</span></div>
</div>
<div id="legend"></div>
<div id="playbackControls">
    <button id="playBtn">▶</button>
    <button id="pauseBtn">⏸</button>
    <button id="chartsBtn">📈</button>
    <!-- Audio: rhythmic + tones + voice (user request) -->
    <button id="audioBtn" title="Музыка: Выкл / Light Morning / Energetic / Chill Paris / Motivational + тоны">🎵</button>
    <!-- Duration mode: 5/10/15/30 сек на весь трек (по умолчанию 15) -->
    <select id="durationSel" title="Длительность воспроизведения всего трека">
        <option value="">По точкам</option>
        <option value="5">5 сек</option>
        <option value="10">10 сек</option>
        <option value="15" selected>15 сек</option>
        <option value="30">30 сек</option>
    </select>
    <!-- Quick Eiffel demo (the official example for GitHub Pages / no server) -->
    <button id="eiffelBtn" title="Загрузить демо: пробежка вокруг Эйфелевой башни (Париж)">🎯 Эйфель</button>
</div>
<div id="chartContainer"><canvas id="chart"></canvas></div>
<div id="tooltip"></div>
<div id="versionTag">v1.1.0 (2026-05-16)</div>
<script type="module" src="app.js"></script>
</body>
</html>
